name: Refresh public profile README

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harishik-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Harishik/Harishik' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu
          python -m pip install -r tools/requirements.txt
      - name: Read public activity and render profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/refresh_profile.py
      - name: Commit generated profile files only
        run: |
          git add -- README.md STATIC.md profile.json assets/
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile visuals'
          git push
